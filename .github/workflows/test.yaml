name: Test

on: [push, pull_request]

jobs:
    test:
        name: PHP ${{ matrix.php-version }} + Symfony ${{ matrix.symfony-version }}
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                php-version: ['7.4','8.0','8.1','8.2','8.3','8.4','8.5']
                symfony-version: ['4.4','5.4','6.4']
                coverage: ['none']
                exclude:
                    # Symfony 6.4 requires PHP >= 8.1
                    - php-version: '7.4'
                      symfony-version: '6.4'
                    - php-version: '8.0'
                      symfony-version: '6.4'
                    # Symfony 4.4 is EOL and not maintained for PHP >= 8.2
                    - php-version: '8.2'
                      symfony-version: '4.4'
                    - php-version: '8.3'
                      symfony-version: '4.4'
                    - php-version: '8.4'
                      symfony-version: '4.4'
                    - php-version: '8.5'
                      symfony-version: '4.4'
                include:
                    - php-version: '7.4'
                      symfony-version: '4.4'
                      coverage: xdebug
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: ${{ matrix.coverage }}
                  ini-values: "memory_limit=-1"
                  php-version: ${{ matrix.php-version }}
                  extensions: gearman
                  tools: composer,flex

            - name: Validate composer.json
              run: composer validate --no-check-lock

            # Symfony 4.4 calls AnnotationRegistry::registerLoader(), removed in doctrine/annotations 2.0
            - name: Keep doctrine/annotations 1.x for Symfony 4.4
              if: matrix.symfony-version == '4.4'
              run: composer require --no-update --no-interaction "doctrine/annotations:^1.5"

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  composer-options: "--prefer-dist"
              env:
                  SYMFONY_REQUIRE: "${{ matrix.symfony-version }}.*"
                  # Every Symfony 4.4 release has security advisories (EOL); Composer blocks them by default
                  COMPOSER_POLICY_ADVISORIES_BLOCK: "${{ matrix.symfony-version == '4.4' && '0' || '1' }}"

            - name: Setup problem matchers for PHP
              run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

            - name: Setup problem matchers for PHPUnit
              run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Run PHPUnit
              if: matrix.coverage == 'none'
              run: vendor/bin/phpunit

            - name: Run PHPUnit with coverage
              if: matrix.coverage != 'none'
              run: vendor/bin/phpunit --coverage-clover=coverage.clover

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse

            - name: Upload Scrutinizer coverage
              if: matrix.coverage != 'none'
              continue-on-error: true
              uses: sudo-bot/action-scrutinizer@latest
              with:
                  cli-args: "--format=php-clover coverage.clover"
